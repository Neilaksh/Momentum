# DORMANT WORKFLOW — kept as a manual reference, never triggered automatically.
#
# This recipe stopped being runnable in 3a7587d ("chore: remove capacitor
# dependencies from package configuration"), which deleted the entire android/
# Gradle project and dropped the @capacitor/* dependencies. The push trigger was
# left in place, so every push to main started this job and failed at "Make
# Gradle Wrapper Executable" (chmod +x android/gradlew — no such file), skipping
# the Capacitor sync, SDK setup, Gradle and APK steps. See runs #19 and #23.
#
# The rest of the Android path is still in the repo (capacitor.config.ts,
# vite.config.android.ts and the `build:static` script), so this file is retained
# rather than deleted. To revive it:
#   1. git checkout 3a7587d^ -- android      # restore the Gradle project
#   2. git show 3a7587d -- package.json      # re-add the removed Capacitor deps,
#                                            # then run `npm install`
#   3. restore the `push: branches: [main]` trigger below
#
# Until then, start it by hand from the Actions tab ("Run workflow") only.
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node Dependencies
        run: npm install

      - name: Build Static Web Assets
        run: npm run build:static

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
